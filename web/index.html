<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0b0d17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="狼人杀" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>狼人杀 · 12人局</title>
    <style>
      /* ───────── 设计变量 ───────── */
      :root {
        --bg: #0b0d17;
        --panel: #161a29;
        --panel-2: #1e2334;
        --panel-3: #262c40;
        --border: #2c3348;
        --text: #e8e9f3;
        --muted: #8b93ad;
        --accent: #4f8cff;
        --wolf: #e0455e;
        --good: #21c08b;
        --warn: #f0a33c;
        --gold: #ffcb5b;
        --radius: 12px;
        --safe-b: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', 'Helvetica Neue', sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #app {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px 14px calc(96px + var(--safe-b));
      }

      h1 {
        font-size: 26px;
        margin: 0 0 4px;
        letter-spacing: 2px;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 10px;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 8px;
        color: var(--muted);
        font-weight: 600;
      }
      p {
        margin: 0 0 10px;
      }

      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      .tiny {
        font-size: 12px;
      }
      .center {
        text-align: center;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .ellipsis {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ───────── 面板 ───────── */
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 12px;
      }
      .panel.tight {
        padding: 10px 12px;
      }

      /* ───────── 按钮 ───────── */
      button {
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        background: var(--panel-3);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 16px;
        cursor: pointer;
        transition: filter 0.12s, transform 0.06s;
        width: 100%;
      }
      button:active:not(:disabled) {
        transform: scale(0.985);
        filter: brightness(1.15);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.primary {
        background: linear-gradient(180deg, #5b95ff, #3f7bf0);
        border-color: #6ba1ff;
        color: #fff;
      }
      button.danger {
        background: linear-gradient(180deg, #e8586f, #cf3450);
        border-color: #ef6d82;
        color: #fff;
      }
      button.good {
        background: linear-gradient(180deg, #2ecd9a, #17a877);
        border-color: #43dcaa;
        color: #04231a;
      }
      button.ghost {
        background: transparent;
      }
      button.sm {
        padding: 8px 12px;
        font-size: 14px;
        width: auto;
      }

      /* ───────── 表单 ───────── */
      input {
        font-family: inherit;
        font-size: 16px; /* 16px 以下 iOS 会自动放大页面 */
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        width: 100%;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      input::placeholder {
        color: #5f677f;
      }
      input.code {
        text-align: center;
        letter-spacing: 8px;
        font-weight: 700;
        font-size: 22px;
        text-transform: uppercase;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      /* ───────── 徽标 ───────── */
      .badge {
        display: inline-block;
        font-size: 11px;
        line-height: 1.5;
        padding: 1px 7px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--panel-3);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.wolf {
        background: rgba(224, 69, 94, 0.16);
        border-color: rgba(224, 69, 94, 0.5);
        color: #ff8b9d;
      }
      .badge.good {
        background: rgba(33, 192, 139, 0.14);
        border-color: rgba(33, 192, 139, 0.45);
        color: #63dbb2;
      }
      .badge.gold {
        background: rgba(255, 203, 91, 0.14);
        border-color: rgba(255, 203, 91, 0.5);
        color: var(--gold);
      }
      .badge.accent {
        background: rgba(79, 140, 255, 0.16);
        border-color: rgba(79, 140, 255, 0.5);
        color: #9dc0ff;
      }
      .badge.warn {
        background: rgba(240, 163, 60, 0.16);
        border-color: rgba(240, 163, 60, 0.5);
        color: #ffc478;
      }

      /* ───────── 座位网格 ───────── */
      .seats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .seat {
        position: relative;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 6px;
        text-align: center;
        min-height: 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        transition: border-color 0.12s, background 0.12s;
      }
      .seat .no {
        font-size: 17px;
        font-weight: 700;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .seat .name {
        font-size: 11px;
        color: var(--muted);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .seat .tag {
        font-size: 10px;
        line-height: 1.4;
      }
      .seat.empty {
        border-style: dashed;
        opacity: 0.5;
      }
      .seat.me {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px rgba(79, 140, 255, 0.35);
      }
      .seat.dead {
        opacity: 0.42;
      }
      .seat.dead .no {
        text-decoration: line-through;
      }
      .seat.wolfmate {
        border-color: rgba(224, 69, 94, 0.65);
        background: rgba(224, 69, 94, 0.1);
      }
      .seat.pickable {
        cursor: pointer;
        border-color: rgba(79, 140, 255, 0.55);
      }
      .seat.pickable:active {
        filter: brightness(1.2);
      }
      .seat.selected {
        border-color: var(--warn);
        background: rgba(240, 163, 60, 0.16);
        box-shadow: 0 0 0 2px rgba(240, 163, 60, 0.3);
      }
      .seat.idiot-revealed {
        border-color: rgba(255, 203, 91, 0.5);
      }

      /* ───────── 我的身份卡 ───────── */
      .rolecard {
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 12px;
        border: 1px solid var(--border);
        background: linear-gradient(135deg, #1c2236, #141826);
      }
      .rolecard.wolf {
        border-color: rgba(224, 69, 94, 0.55);
        background: linear-gradient(135deg, #2a1720, #1a1016);
      }
      .rolecard .role {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ───────── 日志 ───────── */
      .log {
        max-height: 190px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .log div {
        font-size: 13px;
        color: var(--muted);
        padding: 3px 0;
        border-bottom: 1px dashed rgba(44, 51, 72, 0.5);
      }
      .log div:last-child {
        border-bottom: none;
        color: var(--text);
      }

      /* ───────── 顶部阶段条 ───────── */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        margin: -16px -14px 12px;
        padding: 10px 14px;
        background: rgba(11, 13, 23, 0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .phase {
        font-size: 17px;
        font-weight: 700;
      }
      .countdown {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 15px;
        font-weight: 700;
        color: var(--warn);
      }
      .progress {
        height: 4px;
        background: var(--panel-3);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 8px;
      }
      .progress > i {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.2s;
      }

      /* ───────── 底部操作栏 ───────── */
      .actionbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        padding: 10px 14px calc(10px + var(--safe-b));
        background: rgba(15, 18, 30, 0.97);
        backdrop-filter: blur(10px);
        border-top: 1px solid var(--border);
      }
      .actionbar-inner {
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* ───────── 提示条 ───────── */
      .toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(96px + var(--safe-b));
        z-index: 60;
        max-width: 88vw;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        background: #33394f;
        border: 1px solid #464e6b;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      .toast.warn {
        background: #4a3418;
        border-color: #7a5726;
      }
      .toast.error {
        background: #4a1c26;
        border-color: #7d2f3e;
      }

      .banner {
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
        font-size: 14px;
        border: 1px solid var(--border);
        background: var(--panel-2);
      }
      .banner.warn {
        background: rgba(240, 163, 60, 0.12);
        border-color: rgba(240, 163, 60, 0.45);
        color: #ffd79a;
      }
      .banner.good {
        background: rgba(33, 192, 139, 0.12);
        border-color: rgba(33, 192, 139, 0.42);
        color: #8ce7c4;
      }
      .banner.wolf {
        background: rgba(224, 69, 94, 0.12);
        border-color: rgba(224, 69, 94, 0.45);
        color: #ff9dac;
      }

      .conn {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        margin-right: 5px;
        vertical-align: middle;
      }
      .conn.open {
        background: var(--good);
      }
      .conn.connecting {
        background: var(--warn);
      }
      .conn.closed {
        background: var(--wolf);
      }

      table.reveal {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table.reveal td {
        padding: 5px 6px;
        border-bottom: 1px solid var(--border);
      }
      table.reveal tr:last-child td {
        border-bottom: none;
      }

      .spacer {
        height: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>需要开启 JavaScript 才能玩。</noscript>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
